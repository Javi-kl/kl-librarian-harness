name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt \
            ruff==0.15.14 basedpyright==1.39.3
      - name: Mostrar versiones
        run: |
          python --version
          ruff --version
          basedpyright --version
          python -m pytest --version
      - name: Comprobar lint
        run: ruff check .
      - name: Comprobar formato
        run: ruff format --check .
      - name: Comprobar tipos
        run: basedpyright
      - name: Ejecutar tests
        run: python -m pytest
